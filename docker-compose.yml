version: "3.9"

services:
  # ── Infrastructure ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kyntra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kyntra
      POSTGRES_PASSWORD: kyntra_dev
      POSTGRES_DB: kyntra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyntra"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kyntra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kyntra Services ──────────────────────────────────────────────
  collector:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    container_name: kyntra-collector
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://kyntra:kyntra_dev@postgres:5432/kyntra
      REDIS_URL: redis://redis:6379
      PORT: 3001
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analyzer:
    build:
      context: .
      dockerfile: services/analyzer/Dockerfile
    container_name: kyntra-analyzer
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://kyntra:kyntra_dev@postgres:5432/kyntra
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      COLLECTOR_URL: http://collector:3001
      PORT: 3002
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: kyntra-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://kyntra:kyntra_dev@postgres:5432/kyntra
      REDIS_URL: redis://redis:6379
      ANALYZER_URL: http://analyzer:3002
      COLLECTOR_URL: http://collector:3001
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3003}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      PAGERDUTY_INTEGRATION_KEY: ${PAGERDUTY_INTEGRATION_KEY:-}
      PORT: 3000
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: kyntra-dashboard
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      PORT: 3003
    depends_on:
      - gateway

volumes:
  postgres_data:
  redis_data:
