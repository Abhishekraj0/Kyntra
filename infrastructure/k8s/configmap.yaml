apiVersion: v1
kind: ConfigMap
metadata:
  name: kyntra-config
  namespace: kyntra
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  COLLECTOR_URL: "http://kyntra-collector:3001"
  ANALYZER_URL: "http://kyntra-analyzer:3002"
  GATEWAY_URL: "http://kyntra-gateway:3000"
  REDIS_URL: "redis://kyntra-redis:6379"
