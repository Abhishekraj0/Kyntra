apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kyntra-ingress
  namespace: kyntra
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - kyntra.io
    - api.kyntra.io
    - collector.kyntra.io
    secretName: kyntra-tls
  rules:
  - host: api.kyntra.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kyntra-gateway
            port:
              number: 3000
  - host: collector.kyntra.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kyntra-collector
            port:
              number: 3001
  - host: kyntra.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kyntra-dashboard
            port:
              number: 3003
