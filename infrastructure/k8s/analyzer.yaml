apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyntra-analyzer
  namespace: kyntra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analyzer
  template:
    metadata:
      labels:
        app: analyzer
    spec:
      containers:
      - name: analyzer
        image: kyntra/analyzer:latest
        ports:
        - containerPort: 3002
        envFrom:
        - configMapRef:
            name: kyntra-config
        - secretRef:
            name: kyntra-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 20
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kyntra-analyzer
  namespace: kyntra
spec:
  selector:
    app: analyzer
  ports:
  - port: 3002
    targetPort: 3002
