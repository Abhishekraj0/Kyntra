apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyntra-redis
  namespace: kyntra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args: [--save, "60", "1", --loglevel, warning]
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: kyntra-redis
  namespace: kyntra
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
