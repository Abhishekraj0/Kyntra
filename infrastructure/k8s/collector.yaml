apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyntra-collector
  namespace: kyntra
  labels:
    app: collector
spec:
  replicas: 3
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      containers:
      - name: collector
        image: kyntra/collector:latest
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: kyntra-config
        - secretRef:
            name: kyntra-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kyntra-collector
  namespace: kyntra
spec:
  selector:
    app: collector
  ports:
  - port: 3001
    targetPort: 3001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: collector-hpa
  namespace: kyntra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kyntra-collector
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
