# Template — replace values with base64-encoded secrets before applying
# Generate: echo -n "value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: kyntra-secrets
  namespace: kyntra
type: Opaque
data:
  DATABASE_URL: "" # base64 encoded postgresql://...
  ANTHROPIC_API_KEY: "" # base64 encoded sk-ant-...
  JWT_SECRET: "" # base64 encoded random 32+ char string
  GITHUB_WEBHOOK_SECRET: "" # base64 encoded webhook secret
  GITHUB_APP_PRIVATE_KEY: "" # base64 encoded PEM key
