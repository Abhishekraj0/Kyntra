apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyntra-gateway
  namespace: kyntra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: kyntra/gateway:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: kyntra-config
        - secretRef:
            name: kyntra-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: kyntra-gateway
  namespace: kyntra
spec:
  selector:
    app: gateway
  ports:
  - port: 3000
    targetPort: 3000
