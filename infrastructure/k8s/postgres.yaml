apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: kyntra
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kyntra-postgres
  namespace: kyntra
spec:
  serviceName: kyntra-postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          value: kyntra
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kyntra-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: kyntra
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command: [pg_isready, -U, kyntra]
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kyntra-postgres
  namespace: kyntra
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
