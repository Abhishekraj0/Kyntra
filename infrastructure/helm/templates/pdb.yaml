{{- if .Values.podDisruptionBudget.enabled }}
{{- range list "collector" "analyzer" "gateway" "dashboard" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kyntra.fullname" $ }}-{{ . }}
  labels:
    {{- include "kyntra.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "kyntra.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ . }}
{{- end }}
{{- end }}
